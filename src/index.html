<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video stats dashboard</title>
    <link rel="stylesheet" href="./output.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
<!-- //  npx tailwindcss -i ./src/input.css -o ./src/output.css --watch -->
</head>

<body class=" flex items-center justify-center  flex-col bg-[var(--primary-color)] ">
    <nav class="flex items-center justify-between w-[60%]">
       <img src="logo.png" alt="logo" class="size-20">
        <p class="text-[var(--text-color)]">Compare YouTube videos stats</p>
        <button class="dark">Enable </button>
    </nav>
    <main class="bg-[var(--secondary-color)] flex flex-col items-center rounded-2xl m-32 w-[50%]">
        <input id="url1" type="text" placeholder="Enter URL1" required=""
            class="w-[80%] mt-5 p-4 rounded-md  outline-none ">
        <input id="url2" type="text" placeholder="Enter URL2" required=""
            class="w-[80%] mt-5 p-4 rounded-md outline-none">
        <button id="URLsubmit"
            class="cursor-pointer bg-[var(--accent-color)] text-[var(--text-color)] w-32 m-3 h-9  rounded-md hover:bg-[var(--hover-color)] ">Enter <i
                class="ri-arrow-right-line"></i></button>
        <div class="w-[50%] flex items-center justify-center mb-4">
            <label  class="text-[var(--text-color)] ">Need description</label>
            <input type="checkbox" id="needDescription" class="ml-3 accent-[var(--accent-color)] h-5 w-5 ">
        </div>
    </main>

    <i class="ri-arrow-down-line  downArrow  text-[var(--text-color)] text-5xl animate-bounce invisible"></i>
    <section class="flex items-center justify-center ">
        <section class="video1 flex items-center justify-between flex-col sm:flex-row "> </section>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="./index.js"></script>
</body>
<!-- https://colorhunt.co/palette/8fa28ac7d3c0f7f4edc8a96b -->

</html>
